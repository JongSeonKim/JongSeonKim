<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 309" width="846" height="309" role="img" aria-labelledby="title description">
  <title id="title">AI Coding Usage</title>
  <desc id="description">All-time AI coding token usage, costs by tool, and monthly cost trend for Aug 2026 – Nov 2026.</desc>
  <defs>
    <linearGradient id="trend" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#bd93f9" stop-opacity=".26"/><stop offset="1" stop-color="#bd93f9" stop-opacity=".02"/>
    </linearGradient>
    <clipPath id="tool-bar"><rect x="38" y="243" width="770" height="7" rx="3.5"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8f8f2; }
    .muted { fill: #bcbecf; font-size: 13px; }
    .tokens { font-family: Georgia, serif; font-size: 75px; letter-spacing: -5px; fill: #bd93f9; }
  </style>
  <rect x=".5" y=".5" width="845" height="308" rx="19" fill="#282a36" stroke="#44475a"/>
  <text x="38" y="37" font-size="16" font-weight="700">AI Coding Usage</text>
  <text x="808" y="37" text-anchor="end" class="muted">All time</text>
  <path d="M38 52H808 M38 207H808 M379 153H808" fill="none" stroke="#44475a"/>
  <text x="34" y="110" class="tokens">31.14B</text>
  <text x="38" y="143" class="muted">Total tokens</text>
  <text x="38" y="176" font-size="22" font-weight="650">$14,321.97</text>
  <text x="808" y="181" text-anchor="end" class="muted">Aug 2026 – Nov 2026</text>
  <text x="379" y="181" class="muted">Monthly cost</text>
  <text x="38" y="198" class="muted">Total cost</text>
  <path d="M379.0,122.0 L522.0,95.3 L665.0,77.8 L808.0,68.0 V153 H379 Z" fill="url(#trend)"/>
  <path d="M379.0,122.0 L522.0,95.3 L665.0,77.8 L808.0,68.0" fill="none" stroke="#bd93f9" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="808" cy="68.0" r="3" fill="#bd93f9"/>
  <text x="38" y="231" font-size="14" font-weight="650">Cost share by tool</text>
  <g clip-path="url(#tool-bar)"><rect x="38.000" y="243" width="413.499" height="7" fill="#ff79c6"/><rect x="454.499" y="243" width="337.776" height="7" fill="#8be9fd"/><rect x="795.275" y="243" width="12.725" height="7" fill="#ffb86c"/></g>
  <text x="38" y="275" font-size="14">Claude Code <tspan fill="#ff79c6" font-weight="650">54.1%</tspan></text><text x="232" y="275" font-size="14">Codex <tspan fill="#8be9fd" font-weight="650">44.2%</tspan></text><text x="426" y="275" font-size="14">Antigravity <tspan fill="#ffb86c" font-weight="650">1.7%</tspan></text>
</svg>
